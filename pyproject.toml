[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-impact-analysis"
version = "0.1.0"
description = "Reproducible PSM and common-adoption DiD studies"
requires-python = ">=3.9,<3.13"
dependencies = ["numpy>=1.24,<2", "pandas>=2.0,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2", "statsmodels>=0.14,<0.15", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[project.scripts]
causal-study = "causal_impact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
